services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: nova
      POSTGRES_PASSWORD: nova_local
      POSTGRES_DB: nova
    ports: ["127.0.0.1:5433:5432"]
    volumes: ["nova_db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nova"]
      interval: 5s
      retries: 10
  minio:
# MinIO's community images were removed from Docker Hub; Silo is the maintained fork.
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: nova_local
      MINIO_ROOT_PASSWORD: nova_local_password
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["nova_images:/data"]
volumes:
  nova_db:
  nova_images:
